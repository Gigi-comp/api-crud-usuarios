name: Deploy

on:
  workflow_dispatch:

jobs: 
  build:
    runs-on: self-hosted
    steps:
      
      - name: Checando versão mais nova do código
        uses: actions/checkout@v4

      - name: Descendo Versão anterior
        run: docker compose down
      
      - name: Subindo Versão mais nova
        run: docker compose up -d